[package]
name = "navigator_offline"
version = "0.1.0"
edition = "2024"

default-run = "navigator_offline"

[[bin]]
name = "filter"
path = "src/filter.rs"

[[bin]]
name = "dump_graph"
path = "src/dump_graph.rs"

[dependencies]
navigator_common = { path = "../navigator_common" }
geojson = { version = "0.24", features = ["geo-types"] }
geo = "0.28"
osmpbf = "0.3"
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"